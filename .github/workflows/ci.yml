name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Frontend Tests & Build
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./bo-platform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bo-platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npx tsc -b

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8081/api/v1
          VITE_PYTHON_ENGINE_URL: http://localhost:8000

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: bo-platform/dist/
          retention-days: 7

  # Backend Tests & Build
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./bo-backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpass
          MYSQL_DATABASE: bobench_test
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build with Maven
        run: mvn -B package --file pom.xml -DskipTests

      # - name: Run tests
      #   run: mvn test
      #   env:
      #     DB_URL: jdbc:mysql://localhost:3306/bobench_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      #     DB_USER: testuser
      #     DB_PASS: testpass
      #     JWT_SECRET: test_secret_key_for_testing_only_at_least_32_bytes_long
      #     MAIL_USERNAME: test@test.com
      #     MAIL_PASSWORD: testpass

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: bo-backend/target/surefire-reports/
          retention-days: 7

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./bo-backend
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ github.sha }}
          load: true

  # Python Engine Tests & Build
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./bo-engine

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: bo-engine/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python syntax & compile
        run: python -m compileall .

      # - name: Run tests
      #   run: pytest --cov=engine --cov-report=xml

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./bo-engine
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-engine:${{ github.sha }}
          load: true

  # Integration Tests (run after all builds pass)
  integration:
    runs-on: ubuntu-latest
    needs: [frontend, backend, engine]
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start services with docker-compose
        run: docker-compose up -d
        env:
          DB_PASS: testpass
          DB_USER: testuser
          JWT_SECRET: test_secret_key_for_testing_only_at_least_32_bytes_long
          MAIL_USERNAME: test@test.com
          MAIL_PASSWORD: testpass

      - name: Wait for services to be healthy
        run: |
          timeout 120 bash -c 'until curl -f http://localhost:8081/actuator/health; do sleep 5; done'
          timeout 60 bash -c 'until curl -f http://localhost:8000/; do sleep 3; done'

      - name: Run integration tests
        run: |
          # Test backend API
          curl -f http://localhost:8081/api/v1/auth/captcha
          curl -f http://localhost:8000/api/algorithms

      - name: Shutdown services
        if: always()
        run: docker-compose down -v

  # Deploy to staging (on merge to main)
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [frontend, backend, engine]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploy to staging environment"
          # Add your staging deployment commands here
          # Example: kubectl apply -f k8s/staging/
          # or docker-compose -f docker-compose.staging.yml up -d

  # Deploy to production (on tag)
  deploy-production:
    runs-on: ubuntu-latest
    needs: [frontend, backend, engine]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deploy to production environment"
          # Add your production deployment commands here
          # Example: kubectl apply -f k8s/production/